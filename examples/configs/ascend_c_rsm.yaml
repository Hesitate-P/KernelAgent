# KernelAgent on the Ascend C "Ragged Softmax Moments" contest problem.
#
# Required environment (see examples/run_ascend_c_search.py):
#   ASCENDC_RSM_TEMPLATE   pristine contest repo used to materialise variants
#   ASCENDC_RSM_WORK       work root (slot / variants / state / search logs)
#   ASCENDC_RSM_CORRECTNESS  full | fast        (default: fast)
#   ASCENDC_RSM_BENCHMARK    formal | quick     (default: quick)
#   SJTU_API_KEY           LLM credential for the campus gateway
#   SJTU_BASE_URL          default https://models.sjtu.edu.cn/api/v1
#
# Usage:
#   python examples/run_ascend_c_search.py \
#       --template "$ASCENDC_RSM_TEMPLATE" --work-root "$ASCENDC_RSM_WORK" \
#       --config examples/configs/ascend_c_rsm.yaml --max-rounds 3

strategy: beam_search
num_workers: 2
strategy_config:
  # Beam = top-2 candidates kept; both are expanded, along 2 bottleneck
  # directions, by 2 LLMs => 2*2*2 = 8 workers per round.  Lower
  # num_expanding_parents to 1 to halve a round's NPU cost.
  # 2026-09-27: switched to the official DeepSeek platform API (user request);
  # single model => 1*2*1 = 2 workers per round under official rate limits.
  num_top_kernels: 2
  num_bottlenecks: 2
  num_expanding_parents: 1
  models:
    - deepseek-flash
openai_model: deepseek-flash
high_reasoning_effort: false

# One LLM rewrite + one full evaluation per worker process; the beam search in
# the manager drives the rounds, so each worker round is exactly one candidate.
benchmark_warmup: 0
benchmark_repeat: 0
# The objective is a measured speedup ratio; a candidate more than 3x slower
# than the incumbent is not worth continuing from.
divergence_threshold: 200.0
target_platform: npu
gpu_name: "Ascend 910B3"
# Single NPU card: one shared per-device lock collapses all workers onto it.
gpu_ids: [0]

platform:
  # Manager-level components
  verifier: ascend_c
  benchmarker: ascend_c
  worker_runner: ascend_c
  # Worker-level components
  worker_benchmarker: ascend_c
  verification_worker: ascend_c
  specs_provider: ascend_c
  profiler: ascend_c
  roofline_analyzer: ascend_c
  bottleneck_analyzer: ascend_c
  rag_prescriber: ascend_c

templates:
  kernel_optimization: triton_kernel_agent/templates/ascend_c_optimization.j2
  reflexion_prompt: triton_kernel_agent/templates/ascend_c_reflexion.j2
  triton_guidelines: triton_kernel_agent/templates/ascend_c_guidelines.j2
