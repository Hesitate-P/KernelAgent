# Ascend NPU platform config (torch_npu + triton-ascend).
#
# Requires: CANN environment sourced, torch_npu and triton-ascend installed,
# and a DeepSeek (or other) LLM key exported, e.g.:
#   export DEEPSEEK_API_KEY=sk-...
#
# Usage:
#   python examples/run_opt_manager.py \
#       --kernel-dir examples/optimize_01_matvec \
#       --config examples/configs/ascend.yaml

strategy: beam_search
num_workers: 2
strategy_config:
  num_top_kernels: 2
  num_bottlenecks: 2
openai_model: deepseek-chat
high_reasoning_effort: false

# Worker configuration
benchmark_warmup: 25
benchmark_repeat: 100
divergence_threshold: 50.0
target_platform: npu
gpu_name: "Ascend 910B3"

platform:
  # Manager-level components
  verifier: ascend
  benchmarker: ascend
  worker_runner: ascend
  # Worker-level components
  specs_provider: ascend
  profiler: ascend           # timing-only fallback (no NCU on Ascend)
  roofline_analyzer: ascend
  bottleneck_analyzer: nvidia # LLM-based analysis, platform-agnostic
  rag_prescriber: noop

templates:
  kernel_optimization: triton_kernel_agent/templates/kernel_optimization.j2
  reflexion_prompt: triton_kernel_agent/templates/reflexion_prompt.j2
  triton_guidelines: triton_kernel_agent/templates/triton_guidelines.j2
